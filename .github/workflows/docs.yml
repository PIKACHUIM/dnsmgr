name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 文档站固定 base '/'，产物内资源是 /assets/*。GitHub 项目站点默认挂在
      # https://<owner>.github.io/<repo>/ 下，会与 base 冲突，因此缺少自定义域名时直接失败。
      - name: Require root-hosted custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cname=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' 2>/dev/null || true)
          if [ -z "$cname" ]; then
            echo "::error::请先在 Settings → Pages 配置自定义域名；否则站点会落在 /<repo>/ 子路径，与 base '/' 不符。"
            exit 1
          fi
          echo "GitHub Pages custom domain: $cname"

      - name: Build docs
        run: npm run docs:build

      - name: Verify root paths
        run: npm run docs:verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
